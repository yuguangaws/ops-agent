services:
  ops-agent-postgres:
    image: postgres:16
    container_name: ops-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPS_CHECKPOINT_PG_USER:-ops_agent}
      POSTGRES_PASSWORD: ${OPS_CHECKPOINT_PG_PASSWORD:-ops_agent}
      POSTGRES_DB: ${OPS_CHECKPOINT_PG_DATABASE:-ops_agent_checkpoints}
    ports:
      - "${OPS_CHECKPOINT_PG_PORT:-5442}:5432"
    volumes:
      - ops_agent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPS_CHECKPOINT_PG_USER:-ops_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ops_agent_pg_data:
